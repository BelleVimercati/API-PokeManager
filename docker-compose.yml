services:
  api:
    build: .
    container_name: manager_api
    restart: always
    command: sh -c "npx prisma migrate deploy && node dist/src/main/server.js"
    ports:
      - "${PORT:-3333}:3333"
    environment:
      PORT: 3333
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-manager}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-manager_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - manager_network

  postgres:
    image: postgres:16-alpine
    container_name: manager_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-manager_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manager} -d ${POSTGRES_DB:-manager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - manager_network

  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: manager_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@manager.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - manager_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  manager_network:
